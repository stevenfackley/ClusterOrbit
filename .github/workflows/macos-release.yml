name: macOS TestFlight

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Notes for the TestFlight build (informational only)'
        required: false
        default: 'Automated macOS build from main'
  push:
    tags:
      - 'mac-v*'

concurrency:
  group: macos-testflight
  cancel-in-progress: false

jobs:
  testflight:
    runs-on: [self-hosted, macOS, ARM64, clusterorbit-mac]
    defaults:
      run:
        working-directory: app/mobile
    env:
      BUNDLE_ID: com.qavren.clusterorbit
      KEYCHAIN_NAME: clusterorbit-mac-build.keychain
    steps:
      - uses: actions/checkout@v6

      - name: Setup PATH for Homebrew tools
        run: echo "/opt/homebrew/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          flutter --version
          xcodebuild -version
          pod --version

      - name: Seed mobile env
        run: cp .env.example .env

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate macOS Podfile and install pods
        run: |
          flutter precache --macos
          flutter build macos --config-only --no-codesign

      - name: Create temporary keychain
        env:
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_NAME"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
          security list-keychains -d user -s "$KEYCHAIN_NAME" $(security list-keychains -d user | tr -d '"')

      - name: Import WWDR intermediate
        run: |
          WWDR_PATH="$RUNNER_TEMP/wwdr.cer"
          curl -fsSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$WWDR_PATH"
          security import "$WWDR_PATH" -k "$KEYCHAIN_NAME" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm "$WWDR_PATH"

      - name: Import Apple Distribution certificate (app-signing)
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          echo "$CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_NAME" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_NAME"
          rm "$CERT_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_NAME" | grep -q "Apple Distribution" || {
            echo "::error::App-signing identity did not resolve"
            security find-identity -v "$KEYCHAIN_NAME"
            exit 1
          }

      - name: Import Mac Installer Distribution certificate (pkg-signing)
        env:
          INSTALLER_P12_BASE64: ${{ secrets.MAC_INSTALLER_CERT_P12_BASE64 }}
          INSTALLER_PASSWORD: ${{ secrets.MAC_INSTALLER_CERT_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/installer.p12"
          echo "$INSTALLER_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_NAME" -P "$INSTALLER_PASSWORD" \
            -T /usr/bin/productbuild -T /usr/bin/productsign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,productbuild:,productsign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_NAME"
          rm "$CERT_PATH"
          security find-identity -v "$KEYCHAIN_NAME" | grep -q "3rd Party Mac Developer Installer\|Apple Distribution" || {
            echo "::error::Installer-signing identity did not resolve"
            security find-identity -v "$KEYCHAIN_NAME"
            exit 1
          }

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.MAC_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          PROFILE_PATH="$PROFILE_DIR/clusterorbit-mac.provisionprofile"
          echo "$PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"
          PROFILE_PLIST=$(security cms -D -i "$PROFILE_PATH")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$PROFILE_PLIST")
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"

      - name: Build macOS app archive
        run: |
          flutter build macos --release \
            --build-number=${{ github.run_number }}
          APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" | head -1)
          echo "Built: $APP_PATH"
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app found under build/macos/Build/Products/Release"
            ls -la build/macos/Build/Products/Release/ || true
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Build signed .pkg for App Store
        env:
          INSTALLER_IDENTITY: ${{ secrets.MAC_INSTALLER_IDENTITY }}
        run: |
          PKG_PATH="$RUNNER_TEMP/ClusterOrbit.pkg"
          # productbuild bundles the .app into a flat installer
          productbuild \
            --component "$APP_PATH" /Applications \
            --sign "$INSTALLER_IDENTITY" \
            --keychain "$KEYCHAIN_NAME" \
            "$PKG_PATH"
          ls -la "$PKG_PATH"
          echo "PKG_PATH=$PKG_PATH" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
        run: |
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_${API_KEY_ID}.p8"
          echo "$API_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          echo "Uploading $PKG_PATH"
          xcrun altool --upload-app \
            --type macos \
            --file "$PKG_PATH" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"
          rm "$KEY_PATH"

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN_NAME" || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/clusterorbit-mac.provisionprofile" || true
