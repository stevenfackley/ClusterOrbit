name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Seed mobile env
        run: cp .env.example .env
      - name: Install mobile deps
        run: flutter pub get
      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test --coverage
      - name: Upload mobile coverage
        uses: actions/upload-artifact@v7
        with:
          name: mobile-coverage
          path: app/mobile/coverage/lcov.info

  # Builds the Android host app so Gradle/AGP/Kotlin bumps in
  # app/mobile/android are actually exercised (the mobile job never runs Gradle).
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            app/mobile/android/*.gradle*
            app/mobile/android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Seed mobile env
        run: cp .env.example .env
      - name: Install mobile deps
        run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug

  gateway:
    uses: stevenfackley/gh-actions/.github/workflows/ci-go.yml@v1
    with:
      project-name: clusterorbit-gateway
      # govulncheck flags stdlib CVEs against whatever toolchain setup-go
      # resolves; with no version passed it landed on a stale default and
      # has failed every PR since 2026-08-15. Track latest stable instead.
      go-version: stable
    secrets: inherit
