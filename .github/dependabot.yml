version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      go-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # ── Added by the project-wide Dependabot sweep ──────────────────────────
  # Ecosystems present in the repo that no existing entry covered.
  - package-ecosystem: "gradle"
    directory: "/app/mobile/android"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "deps(gradle)"
      include: "scope"
    groups:
      java-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pub"
    directory: "/app/mobile"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "dart"
    commit-message:
      prefix: "deps(pub)"
      include: "scope"
    groups:
      dart-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
